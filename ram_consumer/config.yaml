schemaVersion: 2
publisher:
  author: Developer Name
  company: Company Name
publish:
  tlsKey: aos-user-sp.p12
items:
- identity:
    type: service
    codename: demo-ram-consumer-service
    title: Demo RAM Consumer Service
    description: RAM consumer demo service
  version: 2.0.0
  sourceFolder: service
  images:
  - sourceFolder: x86
    archInfo:
      architecture: amd64
  configuration:
    workingDir: /
    cmd: python3 -u /ramservice/ram_service.py -m 180 -host fakehost
    instances:
      minInstances: 1
    quotas:
      cpuLimit: 1000
      ramLimit: 256MiB
      storageLimit: 32MiB

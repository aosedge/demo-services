schemaVersion: 2

publisher:
  author: AosCloud team
  company: EPAM Systems

publish:
  tlsKey: aos-user-sp.p12

items:

  ############################
  # Seat ECU
- identity:
    type: service
    codename: ev-range-extender-seat-ecu
    title: EV Range Extender Seat ECU

  sourceFolder: services/seat-ecu
  version: 1.0.0

  images:
  - archInfo:
      architecture: any
    sourceFolder: .

  configuration:
    cmd: python3 -u seat_ecu.py
    workingDir: /
    instances:
      minInstances: 1
      priority: 10
    quotas:
      cpuLimit: 1000             # DMIPS
      ramLimit: 128MiB           # 128 MiB
      storageLimit: 32MiB        # 32 GiB
    resources:
    - name: kuksa
      mode: rw
    - name: zenoh
      mode: rw
  dependencies:
  - identity:
      type: layer
      codename: kuksa-client
    versions: ">=6.1.0-bosch.1"
  - identity:
      type: layer
      codename: zenoh-python
    versions: ">=6.1.0-bosch.1"


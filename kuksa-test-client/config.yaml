schemaVersion: 2
publisher:
  author: Developer Name
  company: Company Name
publish:
  tlsKey: aos-user-sp.p12
items:
- identity:
    type: service
    codename: demo-kuksa-test-client-service
    title: Demo KUKSA Test Client Service
    description: KUKSA test client demo service
  version: 2.0.0
  sourceFolder: service
  images:
  - sourceFolder: x86
    archInfo:
      architecture: amd64
  configuration:
    workingDir: /
    cmd: python3 -u kuksa_test_client.py
    instances:
      minInstances: 1
    quotas:
      cpuLimit: 1000
      ramLimit: 128MiB
      storageLimit: 32MiB
    resources:
    - name: kuksa
      mode: rw
  dependencies:
  - identity:
      codename: kuksa-client
      type: layer
    versions: 2.0.0
  - identity:
      codename: pylibs
      type: layer
    versions: 2.0.0

schemaVersion: 2

publisher:
  author: Developer Name
  company: Company Name

publish:
  tlsKey: aos-user-sp.p12

items:
  ##############################################################################
  # RTPS writer. Publishes a counter that both readers subscribe to.
  ##############################################################################
- identity:
    type: service
    codename: demo-rtps-writer
    title: Demo RTPS Writer
    description: Fast DDS publisher used to exercise cross-provider networking

  version: 1.0.0-beta.1
  sourceFolder: output
  images:
  - sourceFolder: amd64
    archInfo:
      architecture: amd64

  configuration:
    workingDir: /
    cmd: /rtps-writer

    # Fast DDS comes from the node rootfs, so the container has to use it as
    # its base layer.
    baseLayerIsNodeRootfs: true

    env:
    - DS_ADDRESS=10.0.0.100
    - DS_PORT=11811
    - TOPIC=RtpsProbe
    - RATE_HZ=1

    instances:
      minInstances: 1
      priority: 10

    # Readers acknowledge to these ports. The range covers the participant ids
    # a single container is likely to use.
    exposedPorts:
      - 7410-7449/udp

    # Substitute the item UUIDs the readers were published under, see the
    # placeholder table in README.md.
    allowedConnections:
    - <demo-rtps-reader-1-uuid>/7410-7449/udp
    - <demo-rtps-reader-2-uuid>/7410-7449/udp

    skipResourceLimits: true
    quotas:
      cpuLimit: 1000
      ramLimit: 128MiB

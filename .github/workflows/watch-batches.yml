# Copy of verification-example/.github/workflows; the job runs in verification-example/.
# In a fork, GitHub lists these workflows only after Actions are enabled there: TRY_IT.md, step 3.
# Ask AosCloud on a schedule whether a new Service version waits on the Verification Set, and start one verification run for it.
# AosCloud sends no notification to a pipeline, so this job asks; nobody has to press anything.
name: watch-batches

on:
  schedule:
    # AosCloud does not notify a pipeline when a new Service version waits (no webhook), so the watch asks
    # every 5 minutes. 5 minutes is the shortest interval GitHub allows. GitHub may start runs late or skip
    # them; for a guaranteed start use Start A. Each run takes about 20 s and only reads. To change it, edit
    # one line in watch-batches.yml: cron: "*/5 * * * *" → "*/10 * * * *" (every 10 min), "*/30 * * * *", "0 *
    # * * *" (hourly). GitHub cannot read this from a variable. Faster than 5 min, or exact timing: start
    # verify-batch right after your upload job (Start A), or use an external scheduler. A webhook
    # from AosCloud would make it instant (feature request).
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: watch-batches
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # The pause switch: the repository variable AOS_WATCH. Not set or on: the watch runs. off: a scheduled run stops here,
  # with no secret and no call to AosCloud. A manual run always goes on, because a person asked for it. Use it when
  # another pipeline verifies the same Service (FAQ, Two pipelines on one Service).
  # In a fork a scheduled run always stops here: a fork with the secrets would verify the uploads of the repository
  # it came from.
  switch:
    runs-on: ubuntu-24.04
    outputs:
      paused: ${{ steps.switch.outputs.paused }}
    steps:
      - name: Is the watch paused
        id: switch
        env:
          AOS_WATCH: ${{ vars.AOS_WATCH }}
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event.repository.fork }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" != schedule ]; then exit 0; fi
          # the event may not carry the repository: then ask GitHub, and stop if it cannot say
          if [ -z "$FORK" ]; then FORK=$(gh api "repos/$GITHUB_REPOSITORY" --jq .fork 2>/dev/null || echo unknown); fi
          if [ "$FORK" != false ]; then
            echo "watch paused: scheduled watch is off in forks" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "paused=yes" >> "$GITHUB_OUTPUT"
          elif [ "$AOS_WATCH" = off ]; then
            echo "watch paused: the variable AOS_WATCH is off" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "paused=yes" >> "$GITHUB_OUTPUT"
          fi

  watch:
    needs: switch
    if: needs.switch.outputs.paused != 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # the secrets live in this environment; required reviewers on it would stop every run of this job (see the FAQ)
    environment: aos-verification
    defaults:
      run:
        working-directory: verification-example
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A value pasted into GitHub often ends with a new line or a space. Trimmed once, here: the API URL and the Service
      # id go to the next steps, the root CA to a file. The key never goes in the env: step 0 trims it as it writes it.
      - name: Check and trim the secrets
        env:
          PASTED_URL: ${{ secrets.AOS_API_URL || vars.AOS_API_URL }}
          PASTED_SERVICE_ID: ${{ secrets.AOS_SERVICE_ID }}
          USER_PEM: ${{ secrets.AOS_USER_PEM }}
          ROOT_CA: ${{ secrets.AOS_ROOT_CA_PEM }}
        run: |
          api_url=$(printf '%s' "$PASTED_URL" | tr -d '[:space:]')
          service_id=$(printf '%s' "$PASTED_SERVICE_ID" | tr -d '[:space:]')
          missing=
          if [ -z "$USER_PEM" ]; then missing="$missing AOS_USER_PEM"; fi
          if [ -z "$ROOT_CA" ]; then missing="$missing AOS_ROOT_CA_PEM"; fi
          if [ -z "$service_id" ]; then missing="$missing AOS_SERVICE_ID"; fi
          if [ -z "$api_url" ]; then missing="$missing AOS_API_URL"; fi
          if [ -n "$missing" ]; then
            echo "::error::Empty:$missing. Put them in the environment aos-verification (see the README, Parameters)"
            exit 1
          fi
          echo "::add-mask::$service_id"
          { echo "AOS_API_URL=$api_url"; echo "SERVICE_ID=$service_id"; } >> "$GITHUB_ENV"
          dir="$RUNNER_TEMP/aos" && mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s\n' "$ROOT_CA" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > "$dir/aos-root-ca.crt"
          echo "AOS_CA=$dir/aos-root-ca.crt" >> "$GITHUB_ENV"

      - name: Say why it asks on a schedule
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Why every 5 minutes? AosCloud does not notify a pipeline when a new Service version waits (no webhook), so the watch asks every 5 minutes. 5 minutes is the shortest interval GitHub allows. GitHub may start runs late or skip them; for a guaranteed start use Start A. Each run takes about 20 s and only reads. To change it, edit one line in `watch-batches.yml`: `cron: "*/5 * * * *"` → `"*/10 * * * *"` (every 10 min), `"*/30 * * * *"`, `"0 * * * *"` (hourly). GitHub cannot read this from a variable. Faster than 5 min, or exact timing: start `verify-batch` right after your upload job (Start A), or use an external scheduler. A webhook from AosCloud would make it instant (feature request).
          SUMMARY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests==2.32.3

      # The only step with the private key. It reads AosCloud, and it deletes the key when it ends.
      - name: 0. Ask AosCloud for a waiting Verification batch
        id: discover
        env:
          TEST_UNITS: ${{ vars.AOS_TEST_UNITS }}
          USER_PEM: ${{ secrets.AOS_USER_PEM }}
        run: |
          units=()
          set -f
          for unit in $TEST_UNITS; do units+=(--unit "$unit"); done
          set +f
          dir="$RUNNER_TEMP/aos"
          trap 'rm -rf "$dir"' EXIT
          (umask 077 && printf '%s\n' "$USER_PEM" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > "$dir/user.pem")
          export AOS_CERT="$dir/user.pem"
          python verify_batch.py discover "${units[@]}"

      # No key here. A run with this batch in its title, in any state, means the batch was handled: a run that
      # timed out is not repeated every 5 minutes. Start it again by hand, with the Service version.
      - name: Start one verification run for the Verification batch
        if: steps.discover.outputs.batch_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BATCH_ID: ${{ steps.discover.outputs.batch_id }}
          VERSION: ${{ steps.discover.outputs.version }}
          UNITS: ${{ steps.discover.outputs.units }}
        run: |
          runs=$(gh run list --workflow verify-batch.yml --limit 200 --json displayTitle,status)
          seen=$(jq -r --arg batch "$BATCH_ID" --arg version "$VERSION" '
            [.[] | (.displayTitle | split(" ")) as $t
             | select($t[1] == $batch or ($t[1] == "manual" and $t[2] == $version)) | .status] | first // empty' <<<"$runs")
          if [ -n "$seen" ]; then
            echo "Verification batch $BATCH_ID, Service version $VERSION already has a run ($seen): nothing to start"
            exit 0
          fi
          echo "starting verify-batch for Verification batch $BATCH_ID, Service version $VERSION, Units $UNITS"
          gh workflow run verify-batch.yml --ref "$GITHUB_REF_NAME" -f version="$VERSION" -f batch_id="$BATCH_ID" -f units="$UNITS"

schemaVersion: 2
publisher:
  author: Developer Name
  company: Company Name
publish:
  tlsKey: aos-user-sp.p12
items:
- identity:
    type: service
    codename: benchmark-network-latency-server
    title: Benchmark network latency server
    description: sockperf servers for the network latency benchmark
  version: 1.0.0-beta.1
  images:
  - sourceFolder: src/server
    archInfo:
      architecture: any
  configuration:
    workingDir: /
    cmd: /usr/bin/python3 -u latency_server.py
    instances:
      minInstances: 1
    skipResourceLimits: true
    quotas:
      cpuLimit: 10000
      ramLimit: 256MiB
      tmpLimit: 64MiB
    hostname: latency-server
    env:
    - PORT=11111
- identity:
    type: service
    codename: benchmark-network-latency-client-service
    title: Benchmark network latency client (service to service)
    description: Round trip time between two services on the same unit
  version: 1.0.0-beta.1
  images:
  - sourceFolder: src/client
    archInfo:
      architecture: any
  configuration:
    workingDir: /
    cmd: /usr/bin/python3 -u latency_client.py
    instances:
      minInstances: 1
    skipResourceLimits: true
    quotas:
      cpuLimit: 10000
      ramLimit: 256MiB
      tmpLimit: 64MiB
    resources:
    - name: victoria-metrics
      mode: rw
    env:
    - TARGET=latency-server
    - DURATION=5
    - PORT=11111
    - MSG_SIZE=64
- identity:
    type: service
    codename: benchmark-network-latency-client-unit
    title: Benchmark network latency client (service to unit)
    description: Round trip time between a service and the node it runs on
  version: 1.0.0-beta.1
  images:
  - sourceFolder: src/client
    archInfo:
      architecture: any
  configuration:
    workingDir: /
    cmd: /usr/bin/python3 -u latency_client.py
    instances:
      minInstances: 1
    skipResourceLimits: true
    quotas:
      cpuLimit: 10000
      ramLimit: 256MiB
      tmpLimit: 64MiB
    resources:
    - name: victoria-metrics
      mode: rw
    env:
    - TARGET=10.0.0.100
    - DURATION=5
    - PORT=11111
    - MSG_SIZE=64
- identity:
    type: service
    codename: benchmark-network-latency-client-external
    title: Benchmark network latency client (service to external)
    description: Round trip time between a service and a host outside the unit
  version: 1.0.0-beta.1
  images:
  - sourceFolder: src/client
    archInfo:
      architecture: any
  configuration:
    workingDir: /
    cmd: /usr/bin/python3 -u latency_client.py
    instances:
      minInstances: 1
    skipResourceLimits: true
    quotas:
      cpuLimit: 10000
      ramLimit: 256MiB
      tmpLimit: 64MiB
    resources:
    - name: victoria-metrics
      mode: rw
    env:
    - TARGET=10.0.0.1
    - DURATION=5
    - PORT=11111
    - MSG_SIZE=64

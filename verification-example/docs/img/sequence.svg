<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="Roboto, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="How the pipeline knows it is time. 1, your upload job uploads a version. 2, AosCloud makes a batch that waits for verification. 3 and 4, the version goes to the test Units, and they report installed and active, or failed. 0, new: every 5 minutes the watch asks AosCloud whether a new version waits, and gets the batch id, the version and the Unit ids of the Verification Set; it starts one verify-batch run per batch. 5, wait checks each Unit until active or failed. 6, the built-in checks and your tests run. 7, one PATCH approves or rejects, only if the batch still waits: Verified goes on to your normal rollout, Invalid stops."><title>How the pipeline knows it is time. 1, your upload job uploads a version. 2, AosCloud makes a batch that waits for verification. 3 and 4, the version goes to the test Units, and they report installed and active, or failed. 0, new: every 5 minutes the watch asks AosCloud whether a new version waits, and gets the batch id, the version and the Unit ids of the Verification Set; it starts one verify-batch run per batch. 5, wait checks each Unit until active or failed. 6, the built-in checks and your tests run. 7, one PATCH approves or rejects, only if the batch still waits: Verified goes on to your normal rollout, Invalid stops.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5793CE"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E7F4F"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#173D7A" flood-opacity="0.12"/></filter></defs>
<rect x="0.5" y="0.5" width="999" height="649" rx="14" fill="#ffffff" stroke="#C9DDF0"/>
<line x1="170" y1="70" x2="170" y2="632" stroke="#C9DDF0" stroke-width="1.5" stroke-dasharray="4 5"/>
<rect x="50" y="18" width="240" height="52" rx="10" fill="#173D7A"/>
<text x="170" y="40" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Your pipeline</text>
<text x="170" y="59" font-size="12" font-weight="400" fill="#D2EDFF" text-anchor="middle">GitHub, SP certificate</text>
<line x1="500" y1="70" x2="500" y2="632" stroke="#C9DDF0" stroke-width="1.5" stroke-dasharray="4 5"/>
<rect x="380" y="18" width="240" height="52" rx="10" fill="#4AA8FF"/>
<text x="500" y="50" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">AosCloud</text>
<line x1="830" y1="70" x2="830" y2="632" stroke="#C9DDF0" stroke-width="1.5" stroke-dasharray="4 5"/>
<rect x="710" y="18" width="240" height="52" rx="10" fill="#173D7A"/>
<text x="830" y="40" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Test Units</text>
<text x="830" y="59" font-size="12" font-weight="400" fill="#D2EDFF" text-anchor="middle">the Verification Set</text>
<circle cx="198" cy="92" r="11" fill="#173D7A"/>
<text x="198" y="96.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<line x1="170" y1="104" x2="497" y2="104" stroke="#5793CE" stroke-width="2" marker-end="url(#ah)"/>
<text x="218" y="96" font-size="13" font-weight="500" fill="#14243F" text-anchor="start">aos-signer upload, as you do today</text>
<g filter="url(#sh)"><rect x="378" y="118" width="244" height="50" rx="10" fill="#EEF7FF" stroke="#4AA8FF" stroke-width="1"/></g>
<circle cx="398" cy="143" r="11" fill="#173D7A"/>
<text x="398" y="147.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="512" y="138" font-size="12.5" font-weight="700" fill="#14243F" text-anchor="middle">A batch: Waiting verification</text>
<text x="512" y="155" font-size="12" font-weight="400" fill="#4F5F75" text-anchor="middle">the version goes only to the Set</text>
<circle cx="528" cy="182" r="11" fill="#173D7A"/>
<text x="528" y="186.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<line x1="500" y1="194" x2="827" y2="194" stroke="#5793CE" stroke-width="2" marker-end="url(#ah)"/>
<text x="548" y="186" font-size="13" font-weight="500" fill="#14243F" text-anchor="start">installs the version</text>
<circle cx="528" cy="216" r="11" fill="#173D7A"/>
<text x="528" y="220.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<line x1="830" y1="228" x2="503" y2="228" stroke="#5793CE" stroke-width="2" marker-end="url(#ah)"/>
<text x="548" y="220" font-size="13" font-weight="500" fill="#14243F" text-anchor="start">installed, active or failed</text>
<g filter="url(#sh)"><rect x="32" y="250" width="276" height="106" rx="10" fill="#E6F6EC" stroke="#1E7F4F" stroke-width="2"/></g>
<circle cx="56" cy="274" r="11" fill="#1E7F4F"/>
<text x="56" y="278.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">0</text>
<text x="74" y="279" font-size="13.5" font-weight="700" fill="#1E7F4F" text-anchor="start">New: watch-batches.yml</text>
<text x="170" y="300" font-size="12" font-weight="500" fill="#14243F" text-anchor="middle">finds any upload; every 5 min, best effort</text>
<text x="170" y="320" font-size="12" font-weight="400" fill="#14243F" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">verify_batch.py discover</text>
<text x="170" y="340" font-size="12" font-weight="400" fill="#4F5F75" text-anchor="middle">is a new version of my Service waiting?</text>
<line x1="308" y1="282" x2="497" y2="282" stroke="#1E7F4F" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="322" y="274" font-size="11.5" font-weight="500" fill="#1E7F4F" text-anchor="start">GET verification-batch/, statistics, units</text>
<line x1="500" y1="326" x2="311" y2="326" stroke="#1E7F4F" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="322" y="318" font-size="11.5" font-weight="500" fill="#1E7F4F" text-anchor="start">batch id, version, Unit ids of the Set</text>
<g filter="url(#sh)"><rect x="32" y="372" width="276" height="52" rx="10" fill="#173D7A" stroke="#173D7A" stroke-width="1"/></g>
<text x="170" y="393" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">starts verify-batch</text>
<text x="170" y="412" font-size="11.5" font-weight="400" fill="#D2EDFF" text-anchor="middle">one run per batch; the title carries its id</text>
<text x="170" y="440" font-size="11.5" font-weight="500" fill="#4F5F75" text-anchor="middle">or the chain: your upload job, right after upload</text>
<circle cx="198" cy="458" r="11" fill="#173D7A"/>
<text x="198" y="462.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<line x1="170" y1="470" x2="497" y2="470" stroke="#5793CE" stroke-width="2" marker-end="url(#ah)"/>
<text x="218" y="462" font-size="13" font-weight="500" fill="#14243F" text-anchor="start">wait: each Unit, until active or failed</text>
<g filter="url(#sh)"><rect x="32" y="484" width="276" height="40" rx="10" fill="#fff" stroke="#173D7A" stroke-width="1.5"/></g>
<circle cx="56" cy="504" r="11" fill="#173D7A"/>
<text x="56" y="508.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="182" y="509" font-size="13" font-weight="600" fill="#14243F" text-anchor="middle">built-in checks and your tests</text>
<circle cx="198" cy="540" r="11" fill="#173D7A"/>
<text x="198" y="544.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<line x1="170" y1="552" x2="497" y2="552" stroke="#5793CE" stroke-width="2" marker-end="url(#ah)"/>
<text x="218" y="544" font-size="12.5" font-weight="500" fill="#14243F" text-anchor="start">one PATCH: approve or reject, if still waiting</text>
<g filter="url(#sh)"><rect x="378" y="566" width="244" height="56" rx="10" fill="#EEF7FF" stroke="#4AA8FF" stroke-width="1"/></g>
<text x="500" y="588" font-size="12.5" font-weight="700" fill="#14603A" text-anchor="middle">Verified: on to your normal rollout</text>
<text x="500" y="608" font-size="12.5" font-weight="700" fill="#8F1D13" text-anchor="middle">Invalid: it stops here</text></svg>

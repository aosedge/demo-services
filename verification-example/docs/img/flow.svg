<text x="540" y="86" font-size="10" font-weight="700" fill="#B3E0FF" text-anchor="start">THIS EXAMPLE</text>
<text x="540" y="101" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Verification job</text>
<circle cx="552" cy="136" r="12" fill="#173D7A"/><text x="552" y="141" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="572" y="134" font-size="13" font-weight="700" fill="#14243F" text-anchor="start">Wait</text>
<text x="622" y="134" font-size="11" font-weight="500" fill="#173D7A" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">verify_batch.py wait</text>
<text x="572" y="151" font-size="11" font-weight="400" fill="#4F5F75" text-anchor="start">version active on the test Units</text>
<circle cx="552" cy="184" r="12" fill="#173D7A"/><text x="552" y="189" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="572" y="182" font-size="13" font-weight="700" fill="#14243F" text-anchor="start">Test</text>
<text x="622" y="182" font-size="11" font-weight="500" fill="#173D7A" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tests/run_tests.sh</text>
<text x="572" y="199" font-size="11" font-weight="400" fill="#4F5F75" text-anchor="start">your checks: exit 0 or 1</text>
<circle cx="552" cy="232" r="12" fill="#173D7A"/><text x="552" y="237" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="572" y="230" font-size="13" font-weight="700" fill="#14243F" text-anchor="start">Decide</text>
<text x="622" y="230" font-size="11" font-weight="500" fill="#173D7A" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">verify_batch.py decide</text>
<text x="572" y="247" font-size="11" font-weight="400" fill="#4F5F75" text-anchor="start">one API call, sent once</text>
<rect x="824" y="88" width="152" height="74" rx="10" fill="#E6F5EC" stroke="#1E7A46"/>
<text x="838" y="112" font-size="14" font-weight="700" fill="#1E7A46" text-anchor="start">✓ Approve</text>
<text x="838" y="132" font-size="12" font-weight="500" fill="#14243F" text-anchor="start">Verified (API: Valid)</text>
<text x="838" y="150" font-size="11" font-weight="400" fill="#4F5F75" text-anchor="start">on to your normal rollout</text>
<rect x="824" y="180" width="152" height="74" rx="10" fill="#FDEDEC" stroke="#B42318"/>
<text x="838" y="204" font-size="14" font-weight="700" fill="#B42318" text-anchor="start">✕ Reject</text>
<text x="838" y="224" font-size="12" font-weight="500" fill="#14243F" text-anchor="start">Invalid</text>
<text x="838" y="242" font-size="11" font-weight="400" fill="#4F5F75" text-anchor="start">stops here</text>

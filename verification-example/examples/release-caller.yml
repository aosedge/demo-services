# Example: your existing upload workflow calls the verification right after "aos-signer upload".
# Or merge these two jobs into your existing upload workflow.
name: release

on:
  push:
    tags: ['v*']

jobs:
  upload:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install aos-signer   # your existing setup
      - id: version
        run: echo "version=$(yq '.items[0].version' config.yaml)" >> "$GITHUB_OUTPUT"
      - run: aos-signer sign && aos-signer upload   # your existing step
  verify:
    needs: upload
    uses: ./.github/workflows/verify-release.yml
    with:
      version: ${{ needs.upload.outputs.version }}
    secrets: inherit

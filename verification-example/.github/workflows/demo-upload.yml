# DEMO ONLY, to try the flow from a fork with one button (TRY_IT.md). A real pipeline uploads from its own build and
# never picks a version like this.
# Reads the highest Service version in AosCloud, builds the next one (patch + 1) of the demo Service, signs it, uploads
# it, and then runs verify-batch in the same run, exactly as README step 3 shows it (Start A). The decision is made
# in the job verify.
name: demo-upload (demo only)
run-name: demo-upload (demo only)

on:
  workflow_dispatch:

# One at a time in this repository: a second press waits until this run, verify included, ends, and then takes the next
# free version.
concurrency:
  group: demo-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # In a fork the repository secrets are enough: GitHub creates this empty environment on the first run.
    environment: aos-verification
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A value pasted into GitHub often ends with a new line or a space: a Service id with one broke the sed of step b.
      # Trimmed once, here: the API URL and the Service id go to the next steps, the root CA to a file. The key never
      # goes in the env: each step trims it as it writes it.
      - name: Check and trim the secrets
        env:
          PASTED_URL: ${{ secrets.AOS_API_URL || vars.AOS_API_URL }}
          PASTED_SERVICE_ID: ${{ secrets.AOS_SERVICE_ID }}
          USER_PEM: ${{ secrets.AOS_USER_PEM }}
          ROOT_CA: ${{ secrets.AOS_ROOT_CA_PEM }}
        run: |
          api_url=$(printf '%s' "$PASTED_URL" | tr -d '[:space:]')
          service_id=$(printf '%s' "$PASTED_SERVICE_ID" | tr -d '[:space:]')
          missing=
          if [ -z "$USER_PEM" ]; then missing="$missing AOS_USER_PEM"; fi
          if [ -z "$ROOT_CA" ]; then missing="$missing AOS_ROOT_CA_PEM"; fi
          if [ -z "$service_id" ]; then missing="$missing AOS_SERVICE_ID"; fi
          if [ -z "$api_url" ]; then missing="$missing AOS_API_URL"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. Add them in Settings, Secrets and variables, Actions (see TRY_IT.md)"
            exit 1
          fi
          echo "::add-mask::$service_id"
          { echo "AOS_API_URL=$api_url"; echo "SERVICE_ID=$service_id"; } >> "$GITHUB_ENV"
          dir="$RUNNER_TEMP/aos" && mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s\n' "$ROOT_CA" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > "$dir/aos-root-ca.crt"
          echo "AOS_CA=$dir/aos-root-ca.crt" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install requests and aos-signer
        run: python -m pip install requests==2.32.3 aos-signer==2.0.2

      # The private key exists only while a step needs it: each step writes it and deletes it when it ends.
      - name: a. Read the next free Service version
        id: next
        env:
          USER_PEM: ${{ secrets.AOS_USER_PEM }}
        run: |
          dir="$RUNNER_TEMP/aos"
          trap 'rm -f "$dir/user.pem"' EXIT
          (umask 077 && printf '%s\n' "$USER_PEM" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > "$dir/user.pem")
          export AOS_CERT="$dir/user.pem"
          version=$(python verify_batch.py next-version --service-id "$SERVICE_ID")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # aos-signer prints the user name of the certificate, an e-mail address: its output never reaches the log as it is.
      - name: b. Build and sign the demo Service
        env:
          USER_PEM: ${{ secrets.AOS_USER_PEM }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/aos"
          trap 'rm -f "$dir/user.pem" "$dir/user.p12"' EXIT
          (umask 077 && printf '%s\n' "$USER_PEM" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > "$dir/user.pem")
          openssl pkcs12 -export -in "$dir/user.pem" -out "$dir/user.p12" -passout pass:
          cp -R demo-service "$dir/bundle"
          sed -i -e "s|__AOS_SERVICE_ID__|$SERVICE_ID|" -e "s|__DEMO_VERSION__|$VERSION|" "$dir/bundle/config.yaml"
          sed -i -e "s|__DEMO_VERSION__|$VERSION|" -e 's|__DEMO_MODE__|good|' -e 's|__DEMO_FAIL_AFTER_S__|300|' \
                 -e 's|__DEMO_GREEDY_MB__|64|' "$dir/bundle/verification-demo/src_any/app.py"
          cd "$dir/bundle"
          set +e
          out=$(COLUMNS=500 aos-signer --skip-check-version sign -p "$dir/user.p12" 2>&1)
          code=$?
          set -e
          sed -E -e $'s/\x1b\\[[0-9;]*m//g' -e 's/user=[^,]*/user=(hidden)/' -e 's/[^[:space:]]+@[^[:space:]]+/(hidden)/g' \
                 -e 's/[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/(hidden)/g' <<<"$out"
          if [ "$code" -ne 0 ]; then echo "::error::aos-signer sign failed"; exit "$code"; fi
          echo "built and signed Service version $VERSION"

      - name: c. Upload (this is the write that creates the Verification batch)
        env:
          USER_PEM: ${{ secrets.AOS_USER_PEM }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/aos"
          trap 'rm -f "$dir/user.pem" "$dir/user.p12"' EXIT
          (umask 077 && printf '%s\n' "$USER_PEM" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > "$dir/user.pem")
          openssl pkcs12 -export -in "$dir/user.pem" -out "$dir/user.p12" -passout pass:
          cd "$dir/bundle"
          set +e
          out=$(COLUMNS=500 aos-signer --skip-check-version upload -p "$dir/user.p12" 2>&1)
          code=$?
          set -e
          sed -E -e $'s/\x1b\\[[0-9;]*m//g' -e 's/user=[^,]*/user=(hidden)/' -e 's/[^[:space:]]+@[^[:space:]]+/(hidden)/g' \
                 -e 's/[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/(hidden)/g' <<<"$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::Upload of Service version $VERSION failed. The user of AOS_USER_PEM needs the permission deployment_bundles_create"
            exit "$code"
          fi
          echo "uploaded Service version $VERSION"

      # No key here. The job verify below gets the version alone: it finds the Verification batch and the Units itself.
      - name: d. Say where the decision is
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "**Demo only:** a real pipeline uploads from its own build."
            echo
            echo "- Service version uploaded: $VERSION"
            echo "- verify-batch runs next, as the job verify of this run (Start A): $url"
            echo "- The decision is in that job; its report follows below on this page."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "uploaded Service version $VERSION: the job verify of this run decides"

      - name: Remove the certificates
        if: always()
        run: rm -rf "$RUNNER_TEMP/aos"

  # Start A, exactly as README step 3 shows it: the upload job above gives the version, and verify-batch runs as a job
  # of this run.
  verify:
    needs: upload
    uses: ./.github/workflows/verify-batch.yml
    with:
      version: ${{ needs.upload.outputs.version }}
    secrets: inherit

# Template of the demo Service bundle, filled in by .github/workflows/demo-upload.yml. Demo only.
# __AOS_SERVICE_ID__ and __DEMO_VERSION__ are replaced at build time. No publish section: the certificate is given to
# aos-signer with -p, and the upload domain comes from it. Nothing secret lives in this file.
schemaVersion: 2
publisher:
  author: AosEdge QA
  company: EPAM Systems
items:
- identity:
    type: service
    codename: verification-demo
    title: Verification demo
    description: 'Self-test Service for the verification flow: prints SELFTEST OK/FAIL
      with its version'
    id: __AOS_SERVICE_ID__
  version: __DEMO_VERSION__
  sourceFolder: verification-demo
  images:
  - sourceFolder: src_any
    archInfo:
      architecture: any
  configuration:
    workingDir: /
    cmd: /usr/bin/python3 -u app.py
    instances:
      minInstances: 1
      priority: 10
    quotas:
      cpuLimit: 5000
      ramLimit: 512MiB
      storageLimit: 32MiB
      stateLimit: 1MiB
      tmpLimit: 256MiB

schemaVersion: 2
publisher:
  author: Developer Name
  company: Company Name
publish:
  tlsKey: aos-user-sp.p12
items:
- identity:
    type: service
    codename: demo-matplot-service
    title: Demo Matplot Service
    description: Matplot demo service
  version: 2.0.0
  sourceFolder: service
  images:
  - sourceFolder: x86
    archInfo:
      architecture: amd64
  configuration:
    workingDir: /
    cmd: /usr/bin/env HOME=/ /usr/bin/python3 -u matplot.py
    instances:
      minInstances: 1
    quotas:
      cpuLimit: 1000
      ramLimit: 128MiB
      storageLimit: 32MiB
      tmpLimit: 32MiB
  dependencies:
  - identity:
      codename: matpotlib
      type: layer
    versions: 2.0.0

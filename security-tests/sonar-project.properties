sonar.projectKey=aosedge_demo-services_security-tests
sonar.projectName=demo-services security-tests
sonar.sources=runner,bootstrap,cloud,probes
sonar.tests=bootstrap,cloud
sonar.test.inclusions=**/test_*.py
sonar.python.version=3.10,3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/__pycache__/**,**/.run/**
# Probe payloads execute inside the unit, in their own container; the test
# process cannot record coverage for them.
sonar.coverage.exclusions=probes/**
